import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.agpia.livre'
    compileSdk 36

    defaultConfig {
        applicationId "com.agpia.livre"
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName "1.3.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Source des mises à jour de contenu (manifest.json + <lang>/chapterN.json), sans republier l'APK.
        buildConfigField "String", "CONTENT_BASE_URL",
            "\"https://raw.githubusercontent.com/asel-hue/LivreAGPIA/main/app/src/main/assets/book/\""
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        // java.time (utilisé par coptic-calendar-core) sur API 24-25.
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}

dependencies {
    // core-ktx 1.18+ exige compileSdk 37 ; 1.17.0 est la dernière version compatible compileSdk 36.
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.3.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'

    // Calendrier copte et contrat d'intégration avec KatamerosCopte (LiturgyContract).
    implementation 'com.github.asel-hue:coptic-calendar-core:0.3.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
